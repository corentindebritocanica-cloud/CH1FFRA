# Publie l'application Prisme (dossier prisme/) sur GitHub Pages.
# Prérequis : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Déployer Prisme

on:
  push:
    branches: [main]
    paths:
      - "prisme/**"
      - ".github/workflows/deploy-prisme.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prisme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prisme
      - id: deployment
        uses: actions/deploy-pages@v4
